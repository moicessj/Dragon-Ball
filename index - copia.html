<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon ball</title>
    <link rel="stylesheet" href="estilo.css/estilo.css">

</head>

<body>
    <main>
        <center>
            <img src="dragon-ball-logo.png" alt="Logo de Dragon Ball" class="logo" width="300" height="150">
        </center>
        <h2><em>Fases del 1-10 <br>
                AF
            </em></h2>

        <section class="carrusel-section">
            <div class="carrusel">
                <figure class="diapositiva activa">
                    <h3>Super Saiyajin Fase 1</h3>
                    <img src="Ssj1-removebg-preview.png" alt="Goku Super Saiyajin 1" class="imagen">
                    <figcaption>El Super Saiyan 1 es la emblemática transformación de Dragon Ball donde el cabello se
                        vuelve rubio, los ojos turquesa y el poder de combate se multiplica por la ira. Fue alcanzada
                        por primera vez por Goku al enfrentarse a Freezer en el planeta Namek.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 2</h3>
                    <img src="ssj2.png" alt="Goku Super Saiyajin 2" class="imagen">
                    <figcaption>El Super Saiyan 2 es una transformación más poderosa que la Fase 1, con un cabello mas
                        erizado y rafagas de rayos al rededor del aura. Goku alcanzó esta forma durante su entrenamiento
                        en el planeta de Kaiosama.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 3</h3>
                    <img src="Ssj3-removebg-preview.png" alt="Goku Super Saiyajin 3" width="180" height="380">
                    <figcaption>El Super Saiyan 3 es una transformación aún más poderosa que la Fase 2, con un cabello
                        mas largo y sin cejas y manteniendo las rafagas de rayos. Goku alcanzó esta forma durante su
                        entrenamiento en el planeta de Kaiosama.</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 4</h3>
                    <img src="ssj4.png" alt="Goku Super Saiyajin 4" width="350" height="350">
                    <figcaption>El Super Saiyan 4 Presenta un aspecto salvaje cubierto por un pelaje rojo o rojizo, una
                        melena oscura y prominente, y ojos delineados de rojo. Su poder es colosal y restaura al usuario
                        a su estado físico óptimo, combinando la fuerza desatada del Ozaru con el control total del
                        Saiyajin.</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 5</h3>
                    <img src="Ssj5-removebg-preview.png" alt="Goku Super Saiyajin 5" width="220" height="350">
                    <figcaption>El Super Saiyan 5 En la historia de Majin Gokuablez, luce una imponente melena plateada
                        y un pelaje gris claro que cubre gran parte de su cuerpo. Su fuerza supera abismalmente a la de
                        un Dios de la Destrucción, siendo capaz de destruir galaxias enteras con simples ráfagas de
                        energía.</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 6</h3>
                    <img src="Ssj6-removebg-preview.png" alt="Goku Super Saiyajin 6" width="245" height="350">
                    <figcaption>El Super Saiyan 6 Representa un nivel místico donde el Saiyajin obtiene una piel y
                        pelaje de color negro con cuernos diminutos en la frente y un aura de fuego. En esta forma, el
                        usuario domina el Ki maligno o la energía de la dimensión oscura para liberar un poder abrumador
                        sin perder el control.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 7</h3>
                    <img src="Ssj7.png" alt="Goku Super Saiyajin 7" class="imagen">
                    <figcaption>El Super Saiyan 7 Esta fase se caracteriza por un largo cabello azul marino u oscuro y
                        una presencia de Ki helado o cósmico. En la historia de Majin Gokuablez, otorga una velocidad
                        inalcanzable y la capacidad de desgarrar dimensiones para enfrentar a seres invencibles.
                    </figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 8</h3>
                    <img src="ssj8.png" alt="Goku Super Saiyajin 8" width="245" height="350">
                    <figcaption>El Super Saiyan 8 En esta etapa, el guerrero toma un aspecto salvaje con tonos dorados o
                        plateados extremados y ojos completamente oscuros o amarillos según la variante. Multiplica
                        masivamente la fuerza física sacrificando estabilidad, siendo una forma desatada para combates
                        contra villanos supremos.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 9</h3>
                    <img src="ssj9.png" alt="Goku Super Saiyajin 9" width="245" height="340">
                    <figcaption>El Super Saiyan 9 Conocida por un diseño con cabello blanco con mechone negros
                        resplandeciente y cuernitos en el menton .Esta fase Involucra el uso de absorción o sacrificio
                        del poder y esencia de personajes como Zaiko (o variantes como Pycho/Pikkon), equilibrando ki
                        negativo y maligno.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Fase 10</h3>
                    <img src="ssj10.webp" alt="Goku Super Saiyajin 10" width="200" height="350">
                    <figcaption>El Super Saiyan 10 Es la cima más famosa y temida de Dragon Ball AF, con un aspecto
                        totalmente imponente y monstruoso de tono gris plateado o negro con piel sombría. Desata un
                        poder Prohibido e infinito capaz de colapsar la realidad y destruir universos enteros de un solo
                        impacto.</figcaption>
                </figure>

                <div class="indicadores"></div>

                <div class="controles">
                    <button type="button" class="pausar">Pausar</button>
                    <button type="button" class="anterior">Anterior</button>
                    <button type="button" class="siguiente">Siguiente</button>
                </div>
            </div>
        </section>

        <h2><em>Fases Divinas <br>
                Super
            </em></h2>
        <section class="carrusel-section">
            <div class="carrusel">
                <figure class="diapositiva">
                    <h3>Super Saiyajin God</h3>
                    <img src="ssjG-removebg-preview.png" alt="Goku Super Saiyajin God" class="imagen">
                    <figcaption> Presenta un aspecto más delgado y estilizado, con el cabello y las cejas de un color
                        magenta o rojo vivo, acompañados por un aura en llamas. Su fuerza sobrepasa los límites mortales
                        al canalizar el Ki divino, permitiendo luchar al nivel de dioses y curar heridas rápidamente.
                        Goku alcanzo esta transformacion gracias al ritual de la transformación divina que les menciono
                        shenlong y para realizarla se necesita de un total de 6 saiyajins</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Super Saiyajin Blue</h3>
                    <img src="ssjB-removebg-preview.png" alt="Goku Super Saiyajin Blue" class="imagen">
                    <figcaption> El Super Saiyajin Blue luce el peinado erizado tradicional del Super Saiyan pero teñido
                        de un brillante azul turquesa, rodeado por un aura flameante de Ki divino azul. Combina el poder
                        del Super Saiyan God con la primera forma, otorgando una fuerza devastadora con mayor
                        estabilidad y control. Goku alcanzó esta forma durante su entrenamiento con wiss en el planeta
                        de beerus .</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Rose</h3>
                    <img src="SsjR-removebg-preview.png" alt="Goku Black Super Saiyajin Rose" class="imagen">
                    <figcaption> Luce el peinado erizado característico del Super Saiyan pero teñido de un rosa
                        brillante o pastel, con pupilas grisáceas y un aura oscura con tonos morados y carmesí. Su
                        fuerza es equivalente o superior a la del Super Saiyan Blue, manifestando un Ki divino
                        corrompido que le permite crear armas de energía, como hoces y espadas, con una potencia
                        devastadora. es adquirida por zamasu tras robarle el cuerpo a goku y es asi como corrompe el ki
                        divino adquiriendo ese color rosa </figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Blue Evolution</h3>
                    <img src="ssjBE-removebg-preview.png" alt="Vegueta Super Saiyajin Blue Evolution" class="imagen">
                    <figcaption> El Super Saiyajin Blue Evolution se distingue por un tono azul marino mucho más oscuro
                        e intenso en el cabello y las pupilas, junto a una musculatura notablemente más desarrollada.
                        Eleva el poder del Super Saiyan Blue a un nivel superior comparable al de un Dios de la
                        Destrucción, liberando una fuerza colosal sin el desgaste físico del Kaioken. este se consigue
                        por primera vez por vegueta en el torneo del poder tras un ataque de ira.</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Ultra Instinct</h3>
                    <img src="UI-removebg-preview.png" alt="Goku Ultra Instinct incompleto" class="imagen">
                    <figcaption> El Ultra instinto incompleto presenta el cabello erizado de forma similar al estado
                        base, pero con un brillo plateado en los bordes y pupilas de un gris plateado deslumbrante. Su
                        mayor fuerza reside en la capacidad de esquivar y reaccionar ante cualquier ataque de forma
                        automática e inconsciente, aunque su poder ofensivo aún no alcanza su punto máximo.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Ultra Instinct Mastered</h3>
                    <img src="Mui-removebg-preview.png" alt="Goku Ultra Instinct Mastered" class="imagen">
                    <figcaption> El Ultra Instinct Mastered se caracteriza por una melena completamente plateada y
                        brillante, con ojos del mismo tono y un aura divina blanca e incandescente. En esta forma, el
                        cuerpo ataca y defiende por pura intuición, alcanzando un nivel de fuerza y velocidad divinas
                        capaz de superar a los Dioses de la Destrucción.</figcaption>
                </figure>


                <figure class="diapositiva">
                    <h3>Ultra Ego</h3>
                    <img src="UE-removebg-preview.png" alt="Vegueta Ultra Ego" class="imagen">
                    <figcaption> Luce un cabello de color morado o púrpura, una musculatura marcada y la ausencia total
                        de cejas, dándole un aspecto intimidante y salvaje. Su poder radica en la destrucción y aumenta
                        continuamente a medida que el usuario recibe daño en combate, convirtiendo el dolor en una
                        fuerza devastadora e ilimitada. </figcaption>
                </figure>



                <div class="indicadores"></div>
                <div class="controles">
                    <button type="button" class="pausar">Pausar</button>
                    <button type="button" class="anterior">Anterior</button>
                    <button type="button" class="siguiente">Siguiente</button>
                </div>
            </div>
        </section>
        <h2><em>Fases Híbridas/Mutantes</em></h2>
        <section class="carrusel-section">
            <div class="carrusel">
                <figure class="diapositiva activa">
                    <h3>Super Saiyajin Legendario</h3>
                    <img src="shifu/ssjL-removebg-preview.png" alt="Broly Super Saiyajin Legendario" class="imagen">
                    <figcaption>El Super Saiyajin Legendario se caracteriza por una estatura gigantesca, una musculatura
                        excesivamente desarrollada, cabello erizado teñido de verde lima y ojos completamente blancos
                        por la furia. Su fuerza aumenta continuamente a medida que combate.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Modo Bestia</h3>
                    <img src="shifu/Beast-removebg-preview.png" alt="Gohan en Modo Bestia" class="imagen">
                    <figcaption>Se distingue por una enorme melena erizada de color gris plateado, pupilas rojas
                        brillantes y un aura azul violácea con rayos rojos. Su fuerza supera los límites del poder
                        divino.</figcaption>
                </figure>

                <figure class="diapositiva">
                    <h3>Super Saiyajin Maligno</h3>
                    <img src="shifu/ssjM-removebg-preview.png" alt="Cumber Super Saiyajin Maligno" class="imagen">
                    <figcaption>Esta forma luce un largo cabello erizado y un aura oscura y rojiza de Ki maligno. Su
                        Ki corrompido puede infectar a otros guerreros y llevarlos a la ira.</figcaption>
                </figure>

                <div class="indicadores"></div>
                <div class="controles">
                    <button type="button" class="pausar">Pausar</button>
                    <button type="button" class="anterior">Anterior</button>
                    <button type="button" class="siguiente">Siguiente</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        document.querySelectorAll(".carrusel-section").forEach((seccion) => {
            const carrusel = seccion.querySelector(".carrusel");
            const diapositivas = seccion.querySelectorAll(".diapositiva");
            const indicadores = seccion.querySelector(".indicadores");
            const botonPausar = seccion.querySelector(".pausar");
            const botonAnterior = seccion.querySelector(".anterior");
            const botonSiguiente = seccion.querySelector(".siguiente");

            let actual = 0;
            let temporizador;
            let pausado = false;

            diapositivas.forEach((_, indice) => {
                const punto = document.createElement("button");
                punto.type = "button";
                punto.className = "indicador";
                punto.setAttribute("aria-label", `Mostrar diapositiva ${indice + 1}`);
                punto.addEventListener("click", () => mostrar(indice));
                indicadores.appendChild(punto);
            });

            const puntos = indicadores.querySelectorAll(".indicador");

            function mostrar(indice) {
                diapositivas[actual].classList.remove("activa");
                puntos[actual].classList.remove("activo");

                actual = (indice + diapositivas.length) % diapositivas.length;

                diapositivas[actual].classList.add("activa");
                puntos[actual].classList.add("activo");
            }

            function iniciarAvance() {
                clearInterval(temporizador);

                if (!pausado) {
                    temporizador = setInterval(() => mostrar(actual + 1), 5000);
                }
            }

            botonAnterior.addEventListener("click", () => {
                mostrar(actual - 1);
                iniciarAvance();
            });

            botonSiguiente.addEventListener("click", () => {
                mostrar(actual + 1);
                iniciarAvance();
            });

            botonPausar.addEventListener("click", () => {
                pausado = !pausado;
                botonPausar.textContent = pausado ? "Reproducir" : "Pausar";
                iniciarAvance();
            });

            carrusel.addEventListener("mouseenter", () => clearInterval(temporizador));
            carrusel.addEventListener("mouseleave", iniciarAvance);

            mostrar(0);
            iniciarAvance();
        });
    </script>
</body>

</html>
