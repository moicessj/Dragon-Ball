<script>
    const diapositivas = document.querySelectorAll(".diapositiva");
    const indicadores = document.getElementById("indicadores");
    const carrusel = document.querySelector(".carrusel");
    const botonPausar = document.getElementById("pausar");

    let actual = 0;
    let temporizador;
    let pausado = false;

    diapositivas.forEach((_, indice) => {
        const punto = document.createElement("button");
        punto.type = "button";
        punto.className = "indicador";
        punto.setAttribute("aria-label", `Mostrar fase ${indice + 1}`);
        punto.addEventListener("click", () => mostrar(indice));
        indicadores.appendChild(punto);
    });

    const puntos = indicadores.querySelectorAll(".indicador");

    function mostrar(indice) {
        diapositivas[actual].classList.remove("activa");
        puntos[actual].classList.remove("activo");

        actual = (indice + diapositivas.length) % diapositivas.length;

        diapositivas[actual].classList.add("activa");
        puntos[actual].classList.add("activo");
    }

    function iniciarAvance() {
        clearInterval(temporizador);

        if (!pausado) {
            temporizador = setInterval(() => mostrar(actual + 1), 5000);
        }
    }

    document.getElementById("anterior").addEventListener("click", () => {
        mostrar(actual - 1);
        iniciarAvance();
    });

    document.getElementById("siguiente").addEventListener("click", () => {
        mostrar(actual + 1);
        iniciarAvance();
    });

    botonPausar.addEventListener("click", () => {
        pausado = !pausado;
        botonPausar.textContent = pausado ? "Reproducir" : "Pausar";
        iniciarAvance();
    });

    carrusel.addEventListener("mouseenter", () => clearInterval(temporizador));
    carrusel.addEventListener("mouseleave", iniciarAvance);

    mostrar(0);
    iniciarAvance();
</script>
